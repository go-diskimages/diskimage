name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Native jobs run the FULL test suite, including the `integration` package,
  # which builds real ext4/btrfs/xfs/zfs filesystem images via the pure-Go
  # drivers' Format. That work is far too slow under QEMU emulation, so it is
  # restricted to the two native runners.
  native:
    name: native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Test
        run: |
          CGO_ENABLED=0 go test ./... -coverprofile=cover.out -covermode=atomic
          go tool cover -func=cover.out | tail -1
      - name: Coverage gate
        run: |
          # This apex meta-repo is integration-heavy; a 100% gate (used by the
          # leaf sibling repos) is not achievable here. Hold a realistic floor.
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v c="$total" 'BEGIN { if (c+0 < 60.0) { print "coverage below 60.0%"; exit 1 } }'

  # Emulated jobs prove 6-arch buildability: they cross-compile test binaries
  # for EVERY package (including `integration`), so the whole repo is shown to
  # build on each arch. They then run ONLY the non-integration test binaries
  # under QEMU. The integration package is excluded from execution because it
  # formats real filesystem images, which takes minutes per arch under
  # emulation; its build is still validated above. Running the root package +
  # detect/codec + cmd/* under QEMU keeps the byte-order-sensitive logic
  # validated on big-endian s390x without the multi-minute integration cost.
  emulated:
    name: emulated ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu_cpu: rv64,v=true,vlen=128
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu_cpu: la464
          - arch: ppc64le
            image: debian:trixie
            qemu_cpu: power9
          - arch: s390x
            image: debian:trixie
            qemu_cpu: qemu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Set up binfmt (QEMU)
        run: docker run --privileged --rm tonistiigi/binfmt --install all
      - name: Cross-compile per-package test binaries (all packages)
        run: |
          set -euo pipefail
          mkdir -p testbins
          # Compile a test binary for every package: this proves the ENTIRE
          # repo, including the integration package, builds on this arch.
          for pkg in $(go list ./...); do
            name=$(echo "$pkg" | tr '/' '_')
            echo "compiling test binary for $pkg"
            CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
              go test -c -cover -covermode=atomic -o "testbins/${name}.test" "$pkg" || {
                # packages with no test files produce no binary; skip them
                if [ ! -f "testbins/${name}.test" ]; then
                  echo "no test binary for $pkg (likely no tests); skipping"
                fi
              }
          done
          ls -l testbins
      - name: Run non-integration test binaries under QEMU
        run: |
          set -euo pipefail
          # Run as a non-root user: several tests assert that operations on a
          # read-only (0o500) directory fail, which root would bypass. The
          # GitHub Actions workspace is world-writable, so a non-root container
          # user can still write the coverprofile back into it.
          chmod -R a+rwX testbins
          for bin in testbins/*.test; do
            [ -e "$bin" ] || continue
            # Skip the integration package under emulation: it formats real
            # filesystem images (ext4/btrfs/xfs/zfs), which is far too slow
            # under QEMU. Its buildability was already proven above.
            case "$bin" in
              *_integration.test) echo "skipping $bin under emulation (integration)"; continue ;;
            esac
            echo "::group::running $bin on ${{ matrix.arch }}"
            docker run --rm --platform linux/${{ matrix.arch }} \
              --user 1000:1000 \
              -e QEMU_CPU='${{ matrix.qemu_cpu }}' \
              -e TMPDIR=/tmp \
              -v "$PWD":/w -w /tmp \
              ${{ matrix.image }} \
              "/w/$bin" -test.v
            echo "::endgroup::"
          done
